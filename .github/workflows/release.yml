name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid generatePatchesList clean --console=plain || {
            find . -path '*/dependency-verification/*/dependency-verification-report.html' -type f -exec cat {} \;
            exit 1
          }

      - name: Capture official Patcher verification inputs
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["morphe-patcher"])')
          destination="$RUNNER_TEMP/patcher-verification"
          mkdir -p "$destination"
          for extension in module pom jar; do
            filename="morphe-patcher-$version.$extension"
            curl --fail --silent --show-error --location --max-time 60 \
              --user "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              "https://maven.pkg.github.com/MorpheApp/registry/app/morphe/morphe-patcher/$version/$filename" \
              --output "$destination/$filename"
          done
          sha256sum "$destination"/*

      - name: Upload Patcher verification inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patcher-verification
          path: ${{ runner.temp }}/patcher-verification
          retention-days: 3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp
