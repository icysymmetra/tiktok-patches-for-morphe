name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # TikTok patches for Morphe bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/icysymmetra/tiktok-patches-for-morphe/issues?q=is%3Aissue%20label%3Abug).
        - **Review the contribution guidelines**: Make sure your bug report adheres to them. You can find the guidelines [here](https://github.com/icysymmetra/tiktok-patches-for-morphe/blob/main/CONTRIBUTING.md).
  - type: textarea
    attributes:
      label: Bug description
      description: |
        Describe what happened, what you expected, and the steps to reproduce it. Add images or video when they help.
    validations:
      required: true
  - type: textarea
    attributes:
      label: App, patches, and settings
      description: |
        Give the TikTok package and version, the Morphe bundle version, selected patches, and relevant toggle values. For feed issues, include Hide image video, Min/Max views, Min/Max likes, Remove feed ads, Hide livestreams, Hide AI content, and Hide FYP unpersonalized slop videos. Say whether disabling the suspected patch or toggle changes the result, if tested.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: |
        Attach the in-app diagnostic report when available. For feed issues, start Feed debugger before reproducing and attach its original saved file too. Note the approximate time of the event. See the feed debugging guide in docs/feed-controls-and-debugging.md. For crashes, AndroidRuntime logcat output also helps. Review logs for personal information before public upload.
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
